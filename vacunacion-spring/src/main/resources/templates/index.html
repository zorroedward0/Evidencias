<!DOCTYPE html>
<meta charset="UTF-8">
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="#{home.title}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link th:href="@{/css/vacunacion.css}" rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #eef7ff, #dceeff, #f4fbff);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        .navbar-custom {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .navbar-brand {
            font-weight: 700;
            color: #0d6efd !important;
            font-size: 1.4rem;
        }

        .nav-link {
            color: #444 !important;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #0d6efd !important;
        }

        .hero {
            padding: 90px 0 70px;
        }

        .hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
        }

        .hero-title span {
            color: #0d6efd;
        }

        .hero-text {
            color: #5b6475;
            margin-top: 20px;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .btn-main {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(13, 110, 253, 0.25);
        }

        .btn-main:hover {
            transform: translateY(-3px);
            background: #0b5ed7;
            color: white;
        }

        .btn-outline-custom {
            border: 2px solid #0d6efd;
            color: #0d6efd;
            padding: 12px 26px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-outline-custom:hover {
            background: #0d6efd;
            color: white;
        }

        .dashboard-card {
            background: white;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .dashboard-card:hover {
            transform: translateY(-8px);
        }

        .dashboard-card::before {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(13, 110, 253, 0.08);
            border-radius: 50%;
            top: -40px;
            right: -40px;
        }

        .card-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: white;
        }

        .icon-blue {
            background: #0d6efd;
        }

        .icon-green {
            background: #14b789;
        }

        .dashboard-card h4 {
            font-weight: 700;
            margin-bottom: 15px;
            color: #0f172a;
        }

        .dashboard-card p {
            color: #667085;
            line-height: 1.7;
        }

        .info-section {
            margin-top: 90px;
            margin-bottom: 80px;
        }

        .info-box {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.05);
        }

        .info-box i {
            font-size: 2rem;
            color: #0d6efd;
            margin-bottom: 15px;
        }

        footer {
            padding: 25px;
            text-align: center;
            color: #6b7280;
            font-size: 0.95rem;
        }

        .hero-image {
            width: 100%;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-12px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        @media (max-width: 768px) {

            .hero-title {
                font-size: 2.2rem;
            }

            .hero {
                text-align: center;
            }

            .hero-buttons {
                justify-content: center;
            }
        }

        .navbar-custom {
            height: 90px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .navbar-brand {
            position: relative;
            z-index: 2;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, #0d6efd, #4ea1ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 10px 25px rgba(13, 110, 253, 0.25);
        }

        .brand-text h4 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
        }

        .brand-text span {
            font-size: 0.85rem;
            color: #6b7280;
            letter-spacing: 0.5px;
        }

        .nav-decoration {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 18px;
            color: #0d6efd;
            font-size: 1.2rem;
            opacity: 0.75;
        }

        .left-decoration {
            left: 20px;
        }

        .right-decoration {
            right: 20px;
        }

        .nav-decoration i {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(13, 110, 253, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .nav-decoration i:hover {
            transform: translateY(-3px) scale(1.05);
            background: rgba(13, 110, 253, 0.14);
        }

        @media (max-width: 768px) {

            .nav-decoration {
                display: none;
            }

            .brand-text h4 {
                font-size: 1.1rem;
            }

            .brand-text span {
                font-size: 0.75rem;
            }

            .brand-icon {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }

        }

    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light navbar-custom sticky-top">

    <div class="container position-relative justify-content-center">

        <div class="nav-decoration left-decoration">
            <i class="fa-solid fa-virus"></i>
            <i class="fa-solid fa-heart-pulse"></i>
        </div>

        <a class="navbar-brand text-center m-0">

            <div class="d-flex align-items-center gap-3">

                <div class="brand-icon">
                    <i class="fa-solid fa-syringe"></i>
                </div>

                <div class="brand-text">
                    <h4 th:text="#{navbar.brand}"></h4>
                    <span th:text="#{navbar.subtitle}"></span>
                </div>

            </div>

        </a>

        <div class="nav-decoration right-decoration">
            <i class="fa-solid fa-shield-virus"></i>
            <div class="dropdown">

                <button class="btn btn-light btn-sm dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                    <i class="fa-solid fa-globe"></i>

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>

                        <a class="dropdown-item"
                           th:href="@{''(lang='es')}">

                            🇪🇸 <span th:text="#{navbar.language.es}"></span>

                        </a>

                    </li>

                    <li>

                        <a class="dropdown-item"
                           th:href="@{''(lang='en')}">

                            🇺🇸 <span th:text="#{navbar.language.en}"></span>

                        </a>

                    </li>

                </ul>

            </div>
        </div>

    </div>

</nav>

<section class="hero">
    <div class="container">

        <div class="row align-items-center">

            <div class="col-lg-6">

                <h1 class="hero-title">
                    <span th:text="#{hero.title.part1}"></span>
                    <span th:text="#{hero.title.highlight}"></span>
                </h1>

                <p class="hero-text" th:text="#{hero.description}"></p>

                <div class="d-flex gap-3 mt-4 flex-wrap hero-buttons">

                    <a th:href="@{/pacientes}" class="btn btn-main">
                        <i class="fa-solid fa-user-group"></i>
                        <span th:text="#{button.viewPatients}"></span>
                    </a>

                    <a th:href="@{/vacunas}" class="btn btn-outline-custom">
                        <i class="fa-solid fa-syringe"></i>
                        <span th:text="#{button.viewVaccines}"></span>
                    </a>

                </div>

            </div>

            <div class="col-lg-6 text-center mt-5 mt-lg-0">

                <img src="https://cdn-icons-png.flaticon.com/512/2785/2785482.png"
                     class="hero-image"
                     th:alt="#{image.vaccination}">

            </div>

        </div>

    </div>
</section>

<section class="pb-5">
    <div class="container">

        <div class="row g-4">

            <div class="col-md-6">

                <div class="dashboard-card">

                    <div class="card-icon icon-blue">
                        <i class="fa-solid fa-users"></i>
                    </div>

                    <h4 th:text="#{card.patients.title}"></h4>

                    <p th:text="#{card.patients.description}"></p>

                    <a th:href="@{/pacientes}" class="btn btn-main mt-2">
                        <span th:text="#{button.enter}"></span>
                    </a>

                </div>

            </div>

            <div class="col-md-6">

                <div class="dashboard-card">

                    <div class="card-icon icon-green">
                        <i class="fa-solid fa-syringe"></i>
                    </div>

                    <h4 th:text="#{card.vaccines.title}"></h4>

                    <p th:text="#{card.vaccines.description}"></p>

                    <a th:href="@{/vacunas}" class="btn btn-main mt-2">
                        <span th:text="#{button.enter}"></span>
                    </a>

                </div>

            </div>

        </div>

    </div>
</section>

<section class="info-section">
    <div class="container">

        <div class="row g-4">

            <div class="col-md-4">

                <div class="info-box text-center">

                    <i class="fa-solid fa-shield-heart"></i>

                    <h5 class="fw-bold mt-3" th:text="#{info.security.title}"></h5>

                    <p class="text-muted" th:text="#{info.security.description}"></p>

                </div>

            </div>

            <div class="col-md-4">

                <div class="info-box text-center">

                    <i class="fa-solid fa-chart-line"></i>

                    <h5 class="fw-bold mt-3" th:text="#{info.organization.title}"></h5>

                    <p class="text-muted" th:text="#{info.organization.description}"></p>

                </div>

            </div>

            <div class="col-md-4">

                <div class="info-box text-center">

                    <i class="fa-solid fa-laptop-medical"></i>

                    <h5 class="fw-bold mt-3" th:text="#{info.technology.title}"></h5>

                    <p class="text-muted" th:text="#{info.technology.description}"></p>

                </div>

            </div>

        </div>

    </div>
</section>

<footer th:text="#{footer.text}">
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
