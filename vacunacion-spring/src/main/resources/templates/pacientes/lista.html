<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{patients.page.title}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link th:href="@{/css/vacunacion.css}" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div th:replace="~{fragments/navbar :: nav}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2 class="titulo-sistema" th:text="#{patients.title}"></h2>

        <a th:href="@{/pacientes/nuevo}" class="btn btn-form">
            + <span th:text="#{patients.new}"></span>
        </a>

    </div>

    <div id="alerta"
         th:if="${mensaje}"
         class="alert alert-blue"
         th:text="${mensaje}">
    </div>

    <table class="table table-striped table-hover bg-white shadow-sm">

        <thead class="table-info">

        <tr>
            <th th:text="#{table.id}"></th>
            <th th:text="#{patients.fullName}"></th>
            <th th:text="#{patients.document}"></th>
            <th th:text="#{patients.birthDate}"></th>
            <th th:text="#{table.actions}"></th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="paciente : ${pacientes}">

            <td th:text="${paciente.id}"></td>

            <td th:text="${paciente.nombreCompleto}"></td>

            <td th:text="${paciente.documento}"></td>

            <td th:text="${paciente.fechaNacimiento}"></td>

            <td>

                <a th:href="@{/pacientes/{id}/editar(id=${paciente.id})}"
                   class="btn btn-sm btn-warning"
                   th:text="#{button.edit}">
                </a>

                <a href="#"
                   class="btn btn-sm btn-danger"
                   th:onclick="'confirmarEliminacionPaciente(event, ' + ${paciente.id} + ')'">

                    <span th:text="#{button.delete}"></span>

                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(pacientes)}">

            <td colspan="5"
                class="text-center text-muted"
                th:text="#{patients.empty}">
            </td>

        </tr>

        </tbody>

    </table>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {

        const alerta = document.getElementById('alerta');

        if (alerta) {

            setTimeout(() => {
                alerta.classList.add('hidden');
            }, 4000);

        }

    });
</script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">

    function confirmarEliminacionPaciente(event, id) {

        event.preventDefault();

        Swal.fire({

            title: [[#{swal.patient.delete.title}]],
            text: [[#{swal.delete.text}]],
            icon: 'warning',
            width: '350px',
            showCancelButton: true,
            confirmButtonText: [[#{swal.delete.confirm}]],
            cancelButtonText: [[#{swal.delete.cancel}]],
            confirmButtonColor: '#B8341A',
            cancelButtonColor: '#b6cbd5'

            }).then((result) => {

            if (result.isConfirmed) {

                window.location.href = '/pacientes/' + id + '/eliminar';

            }

        });

    }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
