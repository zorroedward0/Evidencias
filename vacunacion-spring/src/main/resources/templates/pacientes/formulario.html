<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">

    <title th:text="#{patient.form.title}"></title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link th:href="@{/css/vacunacion.css}" rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: nav}"></div>

<div class="container mt-4">

    <div class="card shadow-sm" style="max-width:600px;margin:auto;">

        <div class="card-header encabezado-formulario text-white">

            <h4 th:text="${paciente.id != null} ? #{patient.form.edit} : #{patient.form.new}"></h4>

        </div>

        <div class="card-body">

            <form th:object="${paciente}"
                  method="post"
                  th:action="${paciente.id == null}
                 ? '/pacientes'
                 : '/pacientes/' + ${paciente.id}">

                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{patient.form.names}"></label>

                    <input type="text"
                           th:field="*{nombres}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{patient.form.lastNames}"></label>

                    <input type="text"
                           th:field="*{apellidos}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{patient.form.documentNumber}"></label>

                    <input type="text"
                           th:field="*{documento}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{patient.form.birthDate}"></label>

                    <input type="date"
                           class="form-control"
                           name="fechaNacimiento"
                           th:value="${paciente.fechaNacimiento != null ? #temporals.format(paciente.fechaNacimiento, 'yyyy-MM-dd') : ''}"
                           required>

                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success"
                            th:text="#{button.save}">
                    </button>

                    <a th:href="@{/pacientes}"
                       class="btn btn btn-form"
                       th:text="#{button.cancel}">
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
