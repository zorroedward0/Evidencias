<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{vaccines.title}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link th:href="@{/css/vacunacion.css}" rel="stylesheet">

</head>
<body>

<div th:replace="~{fragments/navbar :: nav}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="titulo-sistema" th:text="#{vaccines.title}"></h2>

        <a th:href="@{/vacunas/nuevo}" class="btn btn-form">
            + <span th:text="#{vaccines.new}"></span>
        </a>
    </div>

    <div id="alerta" th:if="${mensaje}" class="alert alert-blue"
         th:text="${mensaje}"></div>

    <table class="table table-bordered table-hover shadow-sm bg-white">

        <thead class="table-info">
        <tr>
            <th th:text="#{table.id}"></th>
            <th th:text="#{table.name}"></th>
            <th th:text="#{table.batch}"></th>
            <th th:text="#{table.laboratory}"></th>
            <th th:text="#{table.expirationDate}"></th>
            <th th:text="#{table.status}"></th>
            <th th:text="#{table.actions}"></th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="vacuna : ${vacunas}">

            <td th:text="${vacuna.id}"></td>
            <td th:text="${vacuna.nombre}"></td>
            <td th:text="${vacuna.lote}"></td>
            <td th:text="${vacuna.laboratorio}"></td>
            <td th:text="${vacuna.fechaVencimiento}"></td>

            <td>
                <span th:if="${vacuna.estaVencida()}" class="badge bg-danger"
                      th:text="#{status.expired}">
                </span>

                <span th:unless="${vacuna.estaVencida()}" class="badge bg-success"
                      th:text="#{status.available}">
                </span>
            </td>

            <td>

                <a th:href="@{/vacunas/{id}/editar(id=${vacuna.id})}"
                   class="btn btn-warning btn-sm"
                   th:text="#{button.edit}">
                </a>

                <a href="#"
                   class="btn btn-danger btn-sm"
                   th:onclick="'confirmarEliminacion(event, ' + ${vacuna.id} + ')'">
                    <span th:text="#{button.delete}"></span>
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(vacunas)}">
            <td colspan="7" class="text-center text-muted"
                th:text="#{vaccines.empty}">
            </td>
        </tr>

        </tbody>

    </table>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const alerta = document.getElementById('alerta');

        if (alerta) {
            setTimeout(() => {
                alerta.classList.add('hidden');
            }, 4000);
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
    function confirmarEliminacion(event, id) {

        event.preventDefault();

        Swal.fire({
            title: [[#{swal.delete.title}]],
        text: [[#{swal.delete.text}]],
        icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#B8341A',
            cancelButtonColor: '#b6cbd5',
            confirmButtonText: [[#{swal.delete.confirm}]],
        cancelButtonText: [[#{swal.delete.cancel}]],
        width: '350px'
    }).then((result) => {

            if (result.isConfirmed) {
                window.location.href = '/vacunas/' + id + '/eliminar';
            }

        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
