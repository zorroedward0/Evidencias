<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="#{vaccine.form.title}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link th:href="@{/css/vacunacion.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: nav}"></div>

<div class="container mt-4">

    <div class="card shadow-sm" style="max-width: 600px; margin: auto;">

        <div class="card-header encabezado-formulario text-white">

            <h4 th:text="${vacuna.id != null} ? #{vaccine.form.edit} : #{vaccine.form.new}"></h4>

        </div>

        <div class="card-body">

            <form th:action="${vacuna.id == null || vacuna.id <=0} ? '/vacunas/new' : '/vacunas/' + ${vacuna.id}"
                  th:object="${vacuna}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label" th:text="#{form.name}"></label>

                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{form.batch}"></label>

                    <input type="text"
                           th:field="*{lote}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{form.laboratory}"></label>

                    <input type="text"
                           th:field="*{laboratorio}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">

                    <label class="form-label"
                           th:text="#{form.expirationDate}"></label>

                    <input type="date"
                           class="form-control"
                           name="fechaVencimiento"
                           th:value="${vacuna.fechaVencimiento != null ? #temporals.format(vacuna.fechaVencimiento, 'yyyy-MM-dd') : ''}"
                           required>

                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-form"
                            th:text="#{button.save}">
                    </button>

                    <a th:href="@{/vacunas}"
                       class="btn btn-secondary"
                       th:text="#{button.cancel}">
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>
</body>
</html>
